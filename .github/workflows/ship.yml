name: Ship to Lightsail

on:
  workflow_dispatch:
    inputs:
      apply_infrastructure:
        description: Apply AWS infrastructure with Terraform
        type: boolean
        default: false
      publish_image:
        description: Build, upload to ECR, and deploy the image to Lightsail
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Infrastructure, releases, and rollback share a lock. Never cancel a running deployment.
concurrency:
  group: production-lightsail
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: eu-west-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform (manual opt-in)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.apply_infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check configuration
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Set repository variable AWS_ACCOUNT_ID from bootstrap outputs"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "Set repository variable TF_STATE_BUCKET from bootstrap outputs"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/exam-github-terraform
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
      - name: Validate and plan
        run: |
          terraform fmt -check -recursive
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          terraform validate
          terraform test
          terraform plan -input=false -lock-timeout=5m -out=release.tfplan
      - name: Apply infrastructure
        run: terraform apply -input=false -auto-approve release.tfplan
      - name: Show infrastructure outputs
        run: terraform output >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Image upload and deployment (manual)
    needs: terraform
    # Allow image-only runs when Terraform is skipped; stop on Terraform failure.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.publish_image && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check configuration
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Run bootstrap and set repository variable AWS_ACCOUNT_ID"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/exam-github-deploy
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Read source version and check immutable release history
        id: version
        run: python scripts/release.py version
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        if: steps.version.outputs.build_required == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.build_required == 'true'
      - name: Build the release image
        if: steps.version.outputs.build_required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.version.outputs.image_uri }}
            ${{ steps.version.outputs.packaging_image_uri }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image
        if: steps.version.outputs.build_required == 'true'
        env:
          IMAGE_URI: ${{ steps.version.outputs.image_uri }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --detach --name release-smoke --publish 127.0.0.1:8080:8080 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges "$IMAGE_URI"
          python scripts/check_service.py --url http://127.0.0.1:8080 \
            --version "$VERSION" --timeout 60
      - name: Remove smoke-test container
        if: always()
        run: |
          if docker container inspect release-smoke >/dev/null 2>&1; then
            docker logs release-smoke
            docker rm --force release-smoke
          fi
      - name: Push the tested image and packaging revision tag
        if: steps.version.outputs.build_required == 'true'
        env:
          IMAGE_URI: ${{ steps.version.outputs.image_uri }}
          PACKAGING_IMAGE_URI: ${{ steps.version.outputs.packaging_image_uri }}
        run: |
          docker push "$IMAGE_URI"
          docker push "$PACKAGING_IMAGE_URI"
      - name: Deploy and verify the selected image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release.py deploy --version "$VERSION"
      - name: Save release and rollback metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-metadata.json
            previous-deployment.json
          if-no-files-found: ignore
          retention-days: 14
