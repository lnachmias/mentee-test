<div id="gh-account-walkthrough" role="group" aria-label="Illustrated GitHub repository variable setup">
  <style>
    #gh-account-walkthrough { --gh-bg:light-dark(#ffffff,#0d1117); --gh-fg:light-dark(#1f2328,#f0f6fc); --gh-border:light-dark(#d1d9e0,#3d444d); --gh-soft:light-dark(#f6f8fa,#151b23); --gh-selected:light-dark(#ddf4ff,#122e43); --gh-green:light-dark(#1f883d,#238636); color:var(--gh-fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #gh-account-walkthrough .journey { display:grid; grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr) 32px minmax(0,1fr); align-items:center; }
    #gh-account-walkthrough figure { margin:0; min-width:0; align-self:start; }
    #gh-account-walkthrough .window { background:var(--gh-bg); border:1px solid var(--gh-border); border-radius:6px; overflow:hidden; }
    #gh-account-walkthrough .chrome { padding:8px 12px; background:var(--gh-soft); border-bottom:1px solid var(--gh-border); font-weight:500; }
    #gh-account-walkthrough .contents { padding:12px; display:grid; gap:12px; }
    #gh-account-walkthrough .selected { background:var(--gh-selected); padding:6px 8px; border-radius:4px; font-weight:500; }
    #gh-account-walkthrough .tabs { display:flex; gap:12px; border-bottom:1px solid var(--gh-border); }
    #gh-account-walkthrough .active { border-bottom:2px solid var(--gh-green); font-weight:500; }
    #gh-account-walkthrough .field { display:grid; gap:4px; font-weight:500; }
    #gh-account-walkthrough input { box-sizing:border-box; min-width:0; width:100%; color:var(--gh-fg); background:var(--gh-soft); border:1px solid var(--gh-border); border-radius:4px; padding:6px 8px; font:inherit; font-weight:400; }
    #gh-account-walkthrough button { border:1px solid var(--gh-border); border-radius:5px; padding:6px 10px; font:inherit; font-weight:500; color:#ffffff; background:var(--gh-green); text-align:center; }
    #gh-account-walkthrough figcaption { margin-top:8px; overflow-wrap:anywhere; font-weight:500; }
    #gh-account-walkthrough .link { display:block; width:100%; height:24px; color:var(--gh-fg); }
    #gh-account-walkthrough .down { display:none; }
    #gh-account-walkthrough .note { margin-top:12px; color:var(--gh-fg); }
    @media(max-width:650px) {
      #gh-account-walkthrough .journey { grid-template-columns:minmax(0,1fr); gap:8px; }
      #gh-account-walkthrough .contents { gap:8px; }
      #gh-account-walkthrough .link { width:100%; height:24px; }
      #gh-account-walkthrough .across { display:none; }
      #gh-account-walkthrough .down { display:inline; }
    }
  </style>
  <div class="journey">
    <figure>
      <div class="window">
        <div class="chrome">Repository → Settings</div>
        <div class="contents">
          <span>Security</span>
          <span>Secrets and variables ▾</span>
          <span class="selected">Actions</span>
        </div>
      </div>
      <figcaption>1. Secrets and variables → Actions</figcaption>
    </figure>
    <svg class="link" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
      <defs><marker id="gh-var-arrow" orient="auto" markerUnits="userSpaceOnUse" refX="8" refY="5" markerWidth="10" markerHeight="10"><path d="M1 1L8 5 1 9" fill="none" stroke="currentColor"/></marker></defs>
      <line class="across" x1="5" y1="12" x2="27" y2="12" marker-end="url(#gh-var-arrow)"/>
      <line class="down" x1="50%" y1="2" x2="50%" y2="22" marker-end="url(#gh-var-arrow)"/>
    </svg>
    <figure>
      <div class="window">
        <div class="chrome">Actions secrets and variables</div>
        <div class="contents">
          <div class="tabs"><span>Secrets</span><span class="active">Variables</span></div>
          <span>Repository variables</span>
          <button type="button" disabled>New repository variable</button>
        </div>
      </div>
      <figcaption>2. Variables → New repository variable</figcaption>
    </figure>
    <svg class="link" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
      <line class="across" x1="5" y1="12" x2="27" y2="12" marker-end="url(#gh-var-arrow)"/>
      <line class="down" x1="50%" y1="2" x2="50%" y2="22" marker-end="url(#gh-var-arrow)"/>
    </svg>
    <figure>
      <div class="window">
        <div class="chrome">New variable</div>
        <div class="contents">
          <label class="field" for="gh-var-name">Name<input id="gh-var-name" value="AWS_ACCOUNT_ID" readonly></label>
          <label class="field" for="gh-var-value">Value<input id="gh-var-value" value="030454160336" readonly></label>
          <button type="button" disabled>Add variable</button>
        </div>
      </div>
      <figcaption>3. Add variable</figcaption>
    </figure>
  </div>
  <div class="note">Illustration · perform these clicks in your GitHub repository</div>
</div>
